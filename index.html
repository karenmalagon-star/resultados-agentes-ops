<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados Agentes Ops</title>
<style>
  body{font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#fff;color:#0f172a;padding:28px 32px;border-radius:16px;width:330px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .box h1{font-size:18px;margin:0 0 4px}
  .box p{font-size:13px;color:#64748b;margin:0 0 18px}
  label{font-size:12px;color:#64748b;display:block;margin:10px 0 4px;font-weight:600}
  input{width:100%;padding:9px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box}
  button{margin-top:20px;width:100%;background:#2563eb;color:#fff;border:0;padding:11px;border-radius:8px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <h1>&#128222; Resultados Agentes Ops</h1>
  <p>Dashboard de gesti&oacute;n de llamadas &middot; Refresh</p>
  <form id="f">
    <label>Usuario</label>
    <input id="u" autocomplete="username">
    <label>Contrase&ntilde;a</label>
    <input id="p" type="password" autocomplete="current-password">
    <button type="submit" id="b">Entrar</button>
    <div class="err" id="e"></div>
  </form>
</div>
<script>
  var EDGE = "https://sbiyedqpqtiqvlgentci.supabase.co/functions/v1/dashboard";
  var SESS_MS = 4 * 3600 * 1000; // la sesion dura 4 horas

  function enter(auth) {
    return fetch(EDGE, { headers: { "Authorization": "Basic " + auth }, cache: "no-store" })
      .then(function (r) {
        if (r.status === 200) {
          return r.text().then(function (html) { document.open(); document.write(html); document.close(); return true; });
        }
        return false;
      });
  }

  // Auto-login si hay sesion valida (menos de 4 horas)
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("fxsession") || "null");
      if (s && s.auth && (Date.now() - s.ts) < SESS_MS) {
        document.getElementById("b").disabled = true;
        document.getElementById("b").textContent = "Entrando...";
        enter(s.auth).then(function (ok) {
          if (!ok) {
            localStorage.removeItem("fxsession");
            document.getElementById("b").disabled = false;
            document.getElementById("b").textContent = "Entrar";
          }
        }).catch(function () {
          document.getElementById("b").disabled = false;
          document.getElementById("b").textContent = "Entrar";
        });
      }
    } catch (e) {}
  })();

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var b = document.getElementById("b"), e = document.getElementById("e");
    b.disabled = true; b.textContent = "Entrando..."; e.textContent = "";
    var u = document.getElementById("u").value, p = document.getElementById("p").value;
    var auth = btoa(u + ":" + p);
    enter(auth).then(function (ok) {
      if (ok) {
        try { localStorage.setItem("fxsession", JSON.stringify({ auth: auth, ts: Date.now() })); } catch (er) {}
      } else {
        e.textContent = "Usuario o contraseña incorrectos.";
        b.disabled = false; b.textContent = "Entrar";
      }
    }).catch(function () {
      e.textContent = "Error de conexión. Intenta de nuevo.";
      b.disabled = false; b.textContent = "Entrar";
    });
  });
</script>
</body>
</html>
