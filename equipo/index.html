<style>

  tr.total td{font-weight:700;background:var(--sur2)}tr.click{cursor:pointer}tr.click:hover td{background:#16223f}

  .pill{display:inline-block;min-width:58px;text-align:center;border-radius:999px;padding:2px 8px;font-weight:600;font-size:13px}

  .gen{font-weight:800;font-size:15px}.rank{display:inline-block;width:22px;color:var(--mut);font-size:12px}
  label{font-size:13px;color:var(--mut)}

  input.n{width:78px;text-align:right}select:disabled,input:disabled{opacity:.55}

  .login{max-width:380px;margin:12vh auto}.login input{width:100%;margin:6px 0 12px}
  #popup{position:fixed;inset:0;background:rgba(6,10,20,.7);display:none;align-items:center;justify-content:center;z-index:50}
  #popup .box{background:var(--bad-soft);border:3px solid var(--bad);border-radius:18px;padding:28px 34px;max-width:640px;width:92%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #popup h2{font-size:26px;color:var(--bad);margin-bottom:12px}#popup .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}#popup .v{font-size:19px;font-weight:600;margin-bottom:10px}
  @media (prefers-reduced-motion:no-preference){.siren{animation:blink .35s steps(2) 5}}@keyframes blink{50%{border-color:var(--warn)}}
</style>

<script>

var $=function(id){return document.getElementById(id)}; var main=$("main");

function hoyISO(){var c=new Date(Date.now()-5*3600000);return c.toISOString().slice(0,10)} function mesISO(){return hoyISO().slice(0,7)}
function ayerISO(f){var d=new Date(f+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function lunesDe(f){var d=new Date(f+"T12:00:00Z");var w=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-w);return d.toISOString().slice(0,10)}

// ---------- alerta: sirena corta tipo ambulancia ----------
$("btnSonido").onclick=function(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();sirena(0.25);$("btnSonido").textContent="🔔 Sonido activo";$("btnSonido").disabled=true}catch(e){}};
function sirena(vol){if(!audioCtx)return;try{var t=audioCtx.currentTime,g=audioCtx.createGain(),osc=audioCtx.createOscillator();osc.type="square";for(var i=0;i<6;i++)osc.frequency.setValueAtTime(i%2?640:960,t+i*0.3);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.9,t+0.05);g.gain.setValueAtTime(vol||0.9,t+1.7);g.gain.exponentialRampToValueAtTime(0.0001,t+1.85);osc.connect(g).connect(audioCtx.destination);osc.start(t);osc.stop(t+1.9)}catch(e){}}
function mostrarPopup(e){$("pAgente").textContent=e.agente||"—";$("pTienda").textContent=[e.orden?"#"+e.orden:null,e.tienda,e.producto].filter(Boolean).join(" · ")||"—";$("pDesc").textContent=e.descripcion||"";$("popup").style.display="flex";$("pbox").classList.add("siren");sirena(0.9)}
$("pCerrar").onclick=function(){$("popup").style.display="none";$("pbox").classList.remove("siren")};
async function pollErrores(){try{var r=await api("errores",{desde:lastErrId==null?0:lastErrId});if(lastErrId==null){lastErrId=r.errores.length?r.errores[r.errores.length-1].id:0;return}r.errores.forEach(function(e){lastErrId=Math.max(lastErrId,e.id);mostrarPopup(e)})}catch(e){}}

// ---------- login / fijar contraseña ----------
function vistaLogin(msg){clearTimers();$("tabs").innerHTML="";$("who").textContent="";$("sub").textContent="";$("btnSalir").classList.add("hidden");$("btnSonido").classList.add("hidden");
  main.innerHTML='<div class="card login"><h2 style="margin-top:0">Ingreso</h2><label>Correo</label><input id="u" type="email" autocomplete="username"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"><button id="go" style="width:100%">Entrar</button><div class="err" id="e">'+esc(msg||"")+'</div></div>';
  var go=async function(){$("e").textContent="";$("go").disabled=true;var r=await sb.auth.signInWithPassword({email:$("u").value.trim(),password:$("p").value});$("go").disabled=false;if(r.error){$("e").textContent="No fue posible entrar: revisa correo y contraseña.";return}arrancar()};
  $("go").onclick=go;$("p").onkeydown=function(ev){if(ev.key==="Enter")go()}}

// ---------- arranque y pestañas por rol ----------
var TABS=[["resumen","Resumen",["equipo","auditoria","admin"]],["efectividad","Efectividad",["equipo","auditoria","admin"]],["cancelacion","Cancelación",["equipo","auditoria","admin"]],["gestiones","Gestiones",["equipo","auditoria","admin"]],["puntualidad","Puntualidad",["equipo","auditoria","admin"]],["auditoria","Auditoría",["equipo","auditoria","admin"]],["errores","Errores de auditoría",["auditoria","admin"]],["asignacion","Asignación del agente",["equipo","admin"]],["config","Configuración del mes",["admin"]],["pago","Pago del mes",["admin"]],["admin","Administración",["admin"]]];
async function arrancar(){var s=(await sb.auth.getSession()).data.session;if(!s)return vistaLogin();
  try{yo=await api("yo")}catch(e){if(e.status===403){await sb.auth.signOut();return vistaLogin("Tu usuario aún no está activado. Pide a un administrador que te asigne un rol.")}return vistaLogin("No fue posible cargar tu perfil.")}

  pintarTabs()}

  ({resumen:vResumen,errores:vErrores,asignacion:vAsignacion,config:vConfig,admin:vAdmin,pago:vPago}[tab]||vIndicador)()}

// ---------- Resumen: Hoy + Acumulado, Real · Meta · Cumplimiento, ordenado por cumplimiento general ----------
var R=null,mesSel=mesISO(),diaSel=null;
async function cargarResumen(){var body={mes:mesSel};if(diaSel)body.dia=diaSel;R=await api("matriz",body);return R}
function bloqueMes(a){var cs=a.cargos||[];return cs.filter(function(c){return c.cargo===a.cargo_hoy&&c.medible})[0]||cs.filter(function(c){return c.medible}).sort(function(x,y){return y.gest-x.gest})[0]||null}
function filaTabla(nombre,tag,b,metas,cargo,aud,esDia,general){
  var m=cargo&&metas[cargo]?metas[cargo]:{};var medible=b&&b.medible!==false&&m.medible;
  var h='<td>'+nombre+(tag?'<span class="cargo">'+tag+'</span>':'')+'</td>';
  if(b&&medible){h+='<td class="sep n">'+pct(b.efectividad_real)+'</td><td class="n">'+pct(m.efectividad)+'</td><td>'+pill(b.efectividad_cumpl)+'</td>';
    h+='<td class="sep n">'+pct(b.cancelacion_real)+'</td><td class="n">'+pct(m.cancelacion)+'</td><td>'+pill(b.cancelacion_cumpl)+'</td>';
    h+='<td class="sep n">'+fmt(b.ritmo)+'</td><td class="n">'+fmt(R.compuerta_ritmo,0)+'</td><td>'+(b.ritmo==null?'<span class="pill n">—</span>':cumpleTxt(b.compuerta))+'</td>'}
  else{h+='<td class="sep n">'+(b?pct(b.efectividad_real):"—")+'</td><td class="n">—</td><td><span class="pill n">—</span></td><td class="sep n">'+(b?pct(b.cancelacion_real):"—")+'</td><td class="n">—</td><td><span class="pill n">—</span></td><td class="sep n">'+(b?fmt(b.ritmo):"—")+'</td><td class="n">'+fmt(R.compuerta_ritmo,0)+'</td><td><span class="pill n">—</span></td>'}
  h+='<td class="sep n">—</td><td class="n">&lt; 3</td><td>'+(esDia?'<span class="pill n">mensual</span>':'<span class="pill n">manual</span>')+'</td>';
  if(esDia){h+='<td class="sep n">—</td><td class="n">—</td><td><span class="pill n">mensual</span></td>'}
  else{var am=R.auditoria_meta_pct;h+='<td class="sep n">'+(aud&&aud.pct!=null?pct(aud.pct,1):"—")+'</td><td class="n">'+(am==null?"por definir":"≤ "+pct(am,0))+'</td><td>'+(aud?cumpleTxt(aud.cumpl):'<span class="pill n">—</span>')+'</td>'}
  h+='<td class="sep gen">'+(general==null?'<span class="pill n">—</span>':pct(general,0))+'</td>';return h}
function tablaResumen(titulo,sub,esDia){
  var ags=(R.agentes||[]).map(function(a){var b=esDia?a.dia:bloqueMes(a);var cargo=esDia?(b?b.cargo:null):(b?b.cargo:a.cargo_hoy);return{a:a,b:b,cargo:cargo,general:b?b.general:null}}).sort(function(x,y){return(y.general==null?-1:y.general)-(x.general==null?-1:x.general)});
  var h='<div class="card big"><h2>'+titulo+' <small>'+sub+'</small></h2><div class="wrap"><table><thead><tr><th></th><th class="grp" colspan="3">Efectividad</th><th class="grp" colspan="3">Cancelación</th><th class="grp" colspan="3">Gestiones</th><th class="grp" colspan="3">Puntualidad</th><th class="grp" colspan="3">Auditoría</th><th class="grp">General</th></tr>';
  h+='<tr><th>Agente (cargo · turno)</th>'+'<th class="sep n">Real</th><th class="n">Meta</th><th>Cumpl.</th>'.repeat(5)+'<th class="sep">Cumpl.</th></tr></thead><tbody>';
  ags.forEach(function(f,i){var a=f.a;var tag=esc(NOMBRE[f.cargo]||"sin asignar")+(a.turno_hoy?" · "+turnoTxt(esDia&&f.b?f.b.turno:a.turno_hoy):"");h+='<tr class="click" data-id="'+esc(a.agent_id)+'">'+filaTabla('<span class="rank">'+(i+1)+'</span>'+esc(a.nombre),tag,f.b,R.metas||{},f.cargo,a.auditoria,esDia,f.general)+'</tr>'});
  if(!esDia){var cons=R.consolidado||{};Object.keys(cons).sort().forEach(function(t){var c=cons[t];var L=c.lider||(R.lideres||{})[t];var rot=L?(L.etiqueta||"Líder")+" · "+L.nombre:"Turno "+turnoTxt(t);
    h+='<tr class="total"><td>'+esc(rot)+'<span class="cargo">'+turnoTxt(t)+' esta semana</span></td><td class="sep n">'+pct(c.efectividad_real)+'</td><td></td><td>'+pill(c.efectividad_cumpl)+'</td><td class="sep n">'+pct(c.cancelacion_real)+'</td><td></td><td>'+pill(c.cancelacion_cumpl)+'</td><td class="sep n">'+fmt(c.ritmo)+'</td><td class="n">'+fmt(R.compuerta_ritmo,0)+'</td><td>'+(c.ritmo==null?'<span class="pill n">—</span>':cumpleTxt(c.compuerta))+'</td><td class="sep"></td><td></td><td></td><td class="sep"></td><td></td><td></td><td class="sep gen">'+(c.general==null?"—":pct(c.general,0))+'</td></tr>'})}
  h+='</tbody></table></div><div class="legend">Ordenados de mayor a menor cumplimiento general. 🟢 ≥100 % · 🟡 90 a &lt;100 % · 🔴 &lt;90 %. Las gestiones por hora son la compuerta: si el mes no llega a '+fmt(R.compuerta_ritmo,0)+', la Efectividad no cumple. Puntualidad y Auditoría se cumplen o no se cumplen.'+(esDia?' Las gestiones por hora de hoy son el cronómetro en vivo.':'')+' Clic en un agente para ver su detalle diario.</div></div>';

    h+='<div class="card"><h2>Escalera de reconocimiento</h2><div class="wrap"><table class="cfg"><thead><tr><th>Cumplimiento</th><th class="n">Reconoce</th></tr></thead><tbody><tr><td>Más de 110 %</td><td class="n">150 %</td></tr><tr><td>100 % a 110 %</td><td class="n">la parte entera</td></tr><tr><td>95 % a menos de 100 %</td><td class="n">95 %</td></tr><tr><td>90 % a menos de 95 %</td><td class="n">80 %</td></tr><tr><td>Menos de 90 %</td><td class="n">0 %</td></tr></tbody></table></div><div class="legend">Fin de la ventana de revisión: <input id="finrev" type="date" value="'+esc(C.fin_revision||"")+'"></div></div>';
    var L=C.cargos.lider||{};h+='<div class="card"><h2>Líder <small>valor del cargo <input id="vlider" class="n" value="'+esc(L.valor||"")+'" style="width:110px"></small></h2><div class="legend">Bloque Operación '+Math.round((L.bloques||{}).operacion*100||70)+' % · Bloque Novedades '+Math.round((L.bloques||{}).novedades*100||30)+' % (vacío hasta que exista la fuente de Novedades). Sin Puntualidad.</div></div>';
    $("form").innerHTML=h}
  async function cargar(){mes=$("cm").value;var r=await api("config_get",{mes:mes});C=r.config;$("ci").textContent="Versión "+C._version+(C._default?" (de fábrica: aún no hay configuración guardada para este mes)":C._heredada?" (heredada de "+C._mes_origen+")":"");pintar()}
  $("cm").onchange=cargar;await cargar();
  if($("cs"))$("cs").onclick=async function(){try{var c=JSON.parse(JSON.stringify(C));Object.keys(c).forEach(function(k){if(k[0]==="_")delete c[k]});
    Array.prototype.forEach.call($("form").querySelectorAll("[data-cargo]"),function(card){var k=card.getAttribute("data-cargo");c.cargos[k].valor=val(card.querySelector(".valor").value);Array.prototype.forEach.call(card.querySelectorAll("tr[data-i]"),function(tr){var v=c.cargos[k].variables[+tr.getAttribute("data-i")];var m=tr.querySelector(".meta");if(m)v.meta=val(m.value);v.peso=val(tr.querySelector(".peso").value)})});
    c.horas_efectivas={M:{},T:{}};Array.prototype.forEach.call($("form").querySelectorAll("tr[data-d]"),function(tr){var d=tr.getAttribute("data-d");c.horas_efectivas.M[d]=val(tr.querySelector(".hM").value);c.horas_efectivas.T[d]=val(tr.querySelector(".hT").value)});
    c.compuerta_ritmo=val($("comp").value);var am=$("audm").value.trim();c.auditoria_meta_pct=am?val(am):null;c.fin_revision=$("finrev").value||c.fin_revision;c.cargos.lider=c.cargos.lider||{};c.cargos.lider.valor=val($("vlider").value);
    var r=await api("config_set",{mes:mes,config:c,motivo:$("mot").value});$("e").textContent="✅ Guardada la versión "+r.version+".";cargar()}catch(e){$("e").textContent=e.message}}}

// ---------- Pago del mes (SOLO admin): monto estimado acumulado por agente y líder ----------
function cop(n){return n==null?"—":"$ "+Math.round(Number(n)).toLocaleString("es-CO")}
function fx(f){return f==null?"—":fmt(f*100,0)+"%"}
async function vPago(){var mes=mesSel;main.innerHTML='<div class="card"><div class="row"><label>Mes <input id="pm" type="month" value="'+mes+'"></label><span class="grow lock" id="pnota"></span></div></div><div id="pkpi"></div><div id="pag"></div><div id="pli"></div>';
  async function cargar(){mes=$("pm").value;var D;try{D=await api("dinero",{mes:mes})}catch(e){$("pag").innerHTML='<div class="card"><span class="err">'+esc(e.message)+'</span></div>';return}
    $("pnota").textContent=D.nota||"";
    $("pkpi").innerHTML='<div class="kpis"><div class="kpi"><div class="v">'+cop(D.totales.total)+'</div><div class="l">Total estimado del mes · agentes + líderes</div></div><div class="kpi"><div class="v">'+cop(D.totales.agentes)+'</div><div class="l">Agentes</div></div><div class="kpi"><div class="v">'+cop(D.totales.lideres)+'</div><div class="l">Líderes</div></div><div class="kpi"><div class="v">'+D.dias_habiles+'</div><div class="l">Días hábiles del mes · hasta '+esc(D.hasta||"")+'</div></div></div>';
    var ags=(D.agentes||[]).slice().sort(function(a,b){return(b.pago_estimado||0)-(a.pago_estimado||0)});
    var h='<div class="card"><h2>Agentes <small>acumulado del mes · ordenados por monto estimado</small></h2><div class="wrap"><table><thead><tr><th>Agente</th><th>Cargo</th><th class="n">Días / hábiles</th><th class="n">Efectividad</th><th class="n">Reconoce</th><th class="n">Cancelación</th><th class="n">Reconoce</th><th class="n">Puntualidad</th><th class="n">Reconocimiento</th><th class="n">Subtotal</th><th class="n">Multiplicador</th><th class="n">Pago estimado</th><th style="text-align:left">Pendientes</th></tr></thead><tbody>';
    ags.forEach(function(a){var cs=a.cargos||[];if(!cs.length){h+='<tr><td>'+esc(a.nombre)+'</td><td colspan="10" class="mut">sin días en cargo medible'+(a.novedades_dias?' · Novedades: '+a.novedades_dias+' día(s), se liquida por fuera':'')+'</td><td class="n gen">'+cop(0)+'</td><td style="text-align:left;white-space:normal" class="small mut">'+esc((a.pendientes||[]).join(" · "))+'</td></tr>';return}
      cs.forEach(function(c,i){h+='<tr>'+(i===0?'<td rowspan="'+cs.length+'">'+esc(a.nombre)+'</td>':'')+'<td>'+esc(c.nombre)+'</td><td class="n">'+c.dias+' / '+c.dias_habiles+'</td><td class="n">'+pct(c.efectividad_cumpl,0)+(c.compuerta===false?' ⛔':'')+'</td><td class="n">'+fx(c.factor_efectividad)+'</td><td class="n">'+pct(c.cancelacion_cumpl,0)+'</td><td class="n">'+fx(c.factor_cancelacion)+'</td><td class="n">'+(c.dias_tarde==null?"pendiente":c.dias_tarde+" tarde → "+fx(c.factor_puntualidad))+'</td><td class="n">'+pct(c.reconocimiento,1)+'</td><td class="n">'+cop(c.subtotal)+'</td>'+(i===0?'<td class="n" rowspan="'+cs.length+'">'+esc(a.multiplicador_txt)+'</td><td class="n gen" rowspan="'+cs.length+'">'+cop(a.pago_estimado)+'</td><td rowspan="'+cs.length+'" style="text-align:left;white-space:normal" class="small mut">'+esc((a.pendientes||[]).join(" · "))+'</td>':'')+'</tr>'})});
    h+='</tbody></table></div><div class="legend">Reconoce = lo que la escalera reconoce del cumplimiento. Subtotal = valor del cargo × (días en el cargo ÷ días hábiles del mes) × reconocimiento ponderado. Pago estimado = suma de subtotales × multiplicador de auditoría. ⛔ = gestiones por hora del mes por debajo de la compuerta: la Efectividad no reconoce.</div></div>';
    $("pag").innerHTML=h;
    var l='<div class="card"><h2>Líderes <small>consolidado de los agentes que firmó cada uno</small></h2><div class="wrap"><table><thead><tr><th>Líder</th><th class="n">Días liderados / debía</th><th class="n">Gest./hora</th><th class="n">Efectividad</th><th class="n">Reconoce</th><th class="n">Cancelación</th><th class="n">Reconoce</th><th class="n">Reconocimiento</th><th class="n">Subtotal</th><th class="n">Multiplicador</th><th class="n">Pago estimado</th><th style="text-align:left">Pendientes</th></tr></thead><tbody>';
    (D.lideres||[]).forEach(function(x){l+='<tr><td>'+esc((x.etiqueta?x.etiqueta+" · ":"")+x.nombre)+'</td><td class="n">'+x.dias_liderados+' / '+x.dias_debia+'</td><td class="n">'+fmt(x.ritmo)+(x.compuerta===false?' ⛔':'')+'</td><td class="n">'+pct(x.efectividad_cumpl,0)+'</td><td class="n">'+fx(x.factor_efectividad)+'</td><td class="n">'+pct(x.cancelacion_cumpl,0)+'</td><td class="n">'+fx(x.factor_cancelacion)+'</td><td class="n">'+pct(x.reconocimiento,1)+'</td><td class="n">'+cop(x.pago_variables)+'</td><td class="n">'+esc(x.multiplicador_txt)+'</td><td class="n gen">'+cop(x.pago_estimado)+'</td><td style="text-align:left;white-space:normal" class="small mut">'+esc((x.pendientes||[]).join(" · "))+'</td></tr>'});
    $("pli").innerHTML=l+'</tbody></table></div><div class="legend">Valor del cargo de líder × (días liderados ÷ días que debía liderar) × reconocimiento del bloque Operación (Efectividad 50 · Cancelación 35, sin Puntualidad). El bloque Novedades queda vacío hasta que exista su fuente.</div></div>'}
  $("pm").onchange=cargar;await cargar()}

// ---------- Administración (admin): usuarios y roles, agentes y alias ----------
async function vAdmin(){main.innerHTML='<div class="card"><div class="row"><button class="sec" data-t="usuarios">Usuarios y roles</button><button class="sec" data-t="agentes">Agentes y alias</button></div></div><div id="adm"></div>';Array.prototype.forEach.call(main.querySelectorAll("button[data-t]"),function(b){b.onclick=function(){({usuarios:admUsuarios,agentes:admAgentes}[b.getAttribute("data-t")])()}});admUsuarios()}
async function admUsuarios(){var r=await api("usuarios");var con={};r.usuarios.forEach(function(u){con[u.auth_uid]=u});
  var h='<div class="card"><h2>Personas con cuenta <small>las cuentas se crean en Supabase; aquí se asigna el rol</small></h2><div class="wrap"><table><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Etiqueta</th><th>Activo</th><th>Ingreso</th><th>Configura</th><th></th></tr></thead><tbody>';
  r.auth.forEach(function(a){var u=con[a.id]||{};h+='<tr data-id="'+a.id+'" data-email="'+esc(a.email)+'"><td>'+esc(a.email)+'</td><td><input class="nm" value="'+esc(u.nombre||"")+'"></td><td><select class="r"><option value="">—</option><option value="equipo"'+(u.rol==="equipo"?" selected":"")+'>Líder</option><option value="auditoria"'+(u.rol==="auditoria"?" selected":"")+'>Auditoría</option><option value="admin"'+(u.rol==="admin"?" selected":"")+'>Admin</option></select></td><td><input class="et" value="'+esc(u.etiqueta||"")+'" placeholder="Líder A" style="width:100px"></td><td><input type="checkbox" class="a"'+(u.activo!==false?" checked":"")+'></td><td><input type="date" class="fi" value="'+esc(u.fecha_ingreso||"")+'"></td><td><input type="checkbox" class="pc"'+(u.puede_configurar?" checked":"")+'></td><td><button class="sec g">Guardar</button></td></tr>'});
  $("adm").innerHTML=h+'</tbody></table></div><div class="err" id="e"></div></div>';
  Array.prototype.forEach.call($("adm").querySelectorAll("tr[data-id]"),function(tr){tr.querySelector(".g").onclick=async function(){var rol=tr.querySelector(".r").value;if(!rol){$("e").textContent="Elige un rol.";return}try{await api("usuario_set",{auth_uid:tr.getAttribute("data-id"),email:tr.getAttribute("data-email"),nombre:tr.querySelector(".nm").value,rol:rol,etiqueta:tr.querySelector(".et").value,activo:tr.querySelector(".a").checked,fecha_ingreso:tr.querySelector(".fi").value||null,puede_configurar:tr.querySelector(".pc").checked});$("e").textContent="✅ Guardado."}catch(e){$("e").textContent=e.message}}})}
async function admAgentes(){var r=await api("agentes");var aliasPor={};r.alias.forEach(function(a){(aliasPor[a.agent_id]=aliasPor[a.agent_id]||[]).push(a.nombre_norm)});
  var h='<div class="card"><h2>Roster del equipo</h2><div class="wrap"><table><thead><tr><th>Agente</th><th style="text-align:left">Cargo permanente</th><th>Activo</th><th style="text-align:left">Alias (nombres en la historia)</th><th></th></tr></thead><tbody>';
  r.roster.forEach(function(a){h+='<tr data-id="'+esc(a.agent_id)+'" data-n="'+esc(a.nombre)+'"><td>'+esc(a.nombre)+'</td><td style="text-align:left"><select class="cp">'+["verificacion","v_historica","novedades"].map(function(c){return'<option value="'+c+'"'+(c===a.cargo_permanente?" selected":"")+'>'+NOMBRE[c]+'</option>'}).join("")+'</select></td><td><input type="checkbox" class="act"'+(a.activo?" checked":"")+'></td><td style="text-align:left" class="small mut">'+esc((aliasPor[a.agent_id]||[]).join(" · "))+' <input class="al" placeholder="agregar alias" style="width:170px"></td><td><button class="sec g">Guardar</button></td></tr>'});
  h+='</tbody></table></div></div><div class="card"><h2>Agentes de Refresh aún no en el roster <small>marca solo a los del equipo de operaciones</small></h2><div class="wrap"><table><tbody>';
  r.candidatos.forEach(function(c){h+='<tr data-cid="'+esc(c.id)+'" data-cn="'+esc(c.name)+'"><td>'+esc(c.name)+'</td><td><button class="sec add">Agregar al roster</button></td></tr>'});
  $("adm").innerHTML=h+'</tbody></table></div><div class="err" id="e"></div></div>';
  Array.prototype.forEach.call($("adm").querySelectorAll("tr[data-id]"),function(tr){tr.querySelector(".g").onclick=async function(){try{await api("agente_set",{agent_id:tr.getAttribute("data-id"),nombre:tr.getAttribute("data-n"),cargo_permanente:tr.querySelector(".cp").value,activo:tr.querySelector(".act").checked});var al=tr.querySelector(".al").value.trim();if(al)await api("alias_set",{agent_id:tr.getAttribute("data-id"),nombre:al});admAgentes()}catch(e){$("e").textContent=e.message}}});
  Array.prototype.forEach.call($("adm").querySelectorAll("tr[data-cid]"),function(tr){tr.querySelector(".add").onclick=async function(){try{await api("agente_set",{agent_id:tr.getAttribute("data-cid"),nombre:tr.getAttribute("data-cn"),activo:true});admAgentes()}catch(e){$("e").textContent=e.message}}})}

(function(){var hash=location.hash||"";if(/type=(invite|recovery|signup|magiclink)/.test(hash)){sb.auth.onAuthStateChange(function(ev,s){if(s&&(ev==="SIGNED_IN"||ev==="PASSWORD_RECOVERY"||ev==="INITIAL_SESSION"))vistaFijarClave()});setTimeout(function(){sb.auth.getSession().then(function(r){if(r.data.session)vistaFijarClave();else vistaLogin("El enlace venció o ya fue usado. Pide una invitación nueva.")})},1200);return}arrancar()})();
